apiVersion: batch/v1
kind: Job
metadata:
  name: rp-db-migrate
  namespace: rp-prod
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: docker.io/library/rp-api:latest
          imagePullPolicy: Never
          command: ["pnpm", "--filter", "@pkg/db", "db:migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rp-secrets
                  key: DATABASE_URL
