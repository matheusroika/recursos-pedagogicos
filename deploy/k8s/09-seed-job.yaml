apiVersion: batch/v1
kind: Job
metadata:
  name: rp-db-seed
  namespace: rp-prod
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: docker.io/library/rp-api:latest
          imagePullPolicy: Never
          command: ["pnpm", "--filter", "@pkg/db", "db:seed"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rp-secrets
                  key: DATABASE_URL
